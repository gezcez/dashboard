name: CI

on:
  pull_request:
  push:
    branches: [master, main, rewrite]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x
      - run: bun install --frozen-lockfile
      # Generated API types must match the spec they claim to come from. Until the backend
      # publishes openapi.json this is the hand-written stub; switch API_SPEC to staging then.
      - name: api:check
        run: bun run api:check
        env:
          API_SPEC: openapi/stub.openapi.json
      - name: i18n:check
        run: bun run i18n:check
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Format
        run: bun run format:check
      - name: Unit tests
        run: bun run test
      - name: Build (production env)
        run: bun run build
      - name: Bundle budget (initial JS under 250 KB gzip)
        run: bun scripts/bundle-budget.ts

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Playwright smoke (mock mode)
        run: bun run e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
